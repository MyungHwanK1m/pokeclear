<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeClear - 포켓몬 스토리 클리어 도감</title>
    <meta name="description" content="특정 포켓몬과 미진화체로 본가 스토리 엔딩을 보기 위한 전용 육성 가이드 및 엔트리 도감" />
    
    <!-- PWA & Mobile App Meta Tags -->
    <meta name="theme-color" content="#ef233c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokeClear" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Web Font -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script type="module" crossorigin src="./assets/index-DXMurfZC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D4MddAiN.css">
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-red-500 selection:text-white">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(
            (reg) => console.log('PokeClear SW Registered:', reg.scope),
            (err) => console.log('PokeClear SW Failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
